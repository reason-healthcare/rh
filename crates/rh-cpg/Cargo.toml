[package]
name = "rh-cpg"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Clinical Practice Guidelines (CPG) capabilities for FHIR resources"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["cpg", "fhir", "clinical-guidelines", "healthcare"]
categories = ["science", "api-bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
uuid = { version = "1", features = ["v4", "js"] }
rh-cql = { path = "../rh-cql", version = "0.2.8" }
rh-fhirpath = { path = "../rh-fhirpath", version = "0.2.8" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rh-validator = { path = "../rh-validator", version = "0.2.8" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rh-foundation = { path = "../rh-foundation", version = "0.2.8", features = ["wasm"] }
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
