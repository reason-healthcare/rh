[package]
name = "rh-validator"
version = "0.3.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Hybrid FHIR R4 validator with snapshot-based profile validation"
keywords = [
    "fhir",
    "healthcare",
    "validation",
    "profile",
    "hl7",
]
categories = ["parsing", "data-structures", "science"]
readme = "README.md"

[lib]
doctest = false

[features]
default = []
fhir-test-cases = ["zip", "tar", "flate2"]
perf-timings = []

[dependencies]
# Workspace dependencies
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }

# Local workspace crates
rh-foundation = { path = "../rh-foundation", version = "0.3.0", features = ["http"] }
rh-fhirpath = { path = "../rh-fhirpath", version = "0.3.0" }  # FHIRPath invariant validation
rust_decimal = { workspace = true }

# Caching
lru = "0.19.0"

# Parallelism (for future batch validation)
rayon = { workspace = true }

# URL encoding for terminology service
urlencoding = "2.1.3"

# HTTP client for terminology service
reqwest = { workspace = true, features = ["blocking", "json"] }

# Home directory for cache path
dirs = "7.0.0"

# Optional dependencies for FHIR test cases
zip = { version = "9.7.0", default-features = false, features = ["deflate-flate2"], optional = true }
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }

[dev-dependencies]
# Testing with generated FHIR types
rh-hl7-fhir-r4-core = { path = "../rh-hl7_fhir_r4_core", version = "0.3.0" }

# Benchmarking (to be added in Phase 8)
criterion = { workspace = true, features = ["html_reports"] }

[[bench]]
name = "validation"
harness = false

[[bench]]
name = "perf_smoke"
harness = false

[lints]
workspace = true
