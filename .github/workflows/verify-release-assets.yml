name: Verify v0.3.0 release assets

on:
  push:
    branches:
      - codex/verify-release-0.3.0-assets

permissions:
  actions: read
  contents: read

jobs:
  verify-assets:
    name: Verify ${{ matrix.platform }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS arm64
            runs-on: macos-15
            archive: rh-aarch64-apple-darwin.tar.gz
            expected_sha256: 9e0e7cabe6e93f0e3cc92ae2b971e9d6033570a926c19cddba048268646d473a
          - platform: macOS Intel
            runs-on: macos-15-intel
            archive: rh-x86_64-apple-darwin.tar.gz
            expected_sha256: 00213acd93d76174662056d584900e0946ce0f51873562c48f97b627092326c6
          - platform: Linux musl
            runs-on: ubuntu-24.04
            archive: rh-x86_64-unknown-linux-musl.tar.gz
            expected_sha256: 36db89e87d785289df11a04aa4c201a634a5603f10299559c51924e5bafeb796
          - platform: Windows x64
            runs-on: windows-2025
            archive: rh-x86_64-pc-windows-msvc.zip
            expected_sha256: e998986ce4c53b6ee39f2057c877040e2141d1ddfcddb809c80b08b80a1682a5
    runs-on: ${{ matrix.runs-on }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: "37820840016"
      EXPECTED_SHA256: ${{ matrix.expected_sha256 }}

    steps:
      - name: Require pinned run ID and checksum
        if: runner.os != 'Windows'
        shell: bash
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Release workflow run ID must be numeric." >&2; exit 1; }
          [[ "$EXPECTED_SHA256" =~ ^[[:xdigit:]]{64}$ ]] || { echo "Replace the checksum placeholder with the exact SHA256SUMS digest." >&2; exit 1; }

      - name: Require pinned run ID and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:RELEASE_RUN_ID -notmatch '^\d+$') { throw 'Release workflow run ID must be numeric.' }
          if ($env:EXPECTED_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'Replace the checksum placeholder with the exact SHA256SUMS digest.' }

      - name: Download the pinned release-run artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/rh-release-asset"
          mkdir -p "$artifact_dir"
          gh run download "$RELEASE_RUN_ID" --repo reason-healthcare/rh --name "${{ matrix.archive }}" --dir "$artifact_dir"
          archive="$artifact_dir/${{ matrix.archive }}"
          test -f "$archive"
          actual_sha256="$(shasum -a 256 "$archive" | awk '{print tolower($1)}')"
          expected_sha256="$(printf '%s' "$EXPECTED_SHA256" | tr '[:upper:]' '[:lower:]')"
          test "$actual_sha256" = "$expected_sha256" || { echo "SHA-256 mismatch for ${{ matrix.archive }}" >&2; exit 1; }
          printf 'RH_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
          printf 'RH_EXTRACT_DIR=%s/extracted\n' "$artifact_dir" >> "$GITHUB_ENV"

      - name: Download the pinned release-run artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'rh-release-asset'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          gh run download $env:RELEASE_RUN_ID --repo reason-healthcare/rh --name '${{ matrix.archive }}' --dir $artifactDir
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the pinned release-run artifact.' }
          $archive = Join-Path $artifactDir '${{ matrix.archive }}'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw "Missing archive: $archive" }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expected = $env:EXPECTED_SHA256.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'SHA-256 mismatch for ${{ matrix.archive }}' }
          "RH_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RH_EXTRACT_DIR=$(Join-Path $artifactDir 'extracted')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Extract and verify binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RH_EXTRACT_DIR"
          tar -xzf "$RH_ARCHIVE" -C "$RH_EXTRACT_DIR"
          binary="$RH_EXTRACT_DIR/rh"
          test -x "$binary"
          version="$("$binary" --version)"
          [[ "$version" == 'rh 0.3.0' ]] || { echo "Unexpected version output: $version" >&2; exit 1; }
          "$binary" --help >/dev/null

      - name: Extract and verify binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $extractDir = $env:RH_EXTRACT_DIR
          Expand-Archive -LiteralPath $env:RH_ARCHIVE -DestinationPath $extractDir -Force
          $binary = Join-Path $extractDir 'rh.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Archive did not contain rh.exe.' }
          $version = (& $binary --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne 'rh 0.3.0') { throw "Unexpected version output: $version" }
          & $binary --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'rh --help failed.' }
