name: Verify v0.3.0 package distribution

on:
  push:
    branches:
      - codex/verify-release-0.3.0-assets

permissions:
  contents: read

jobs:
  homebrew-macos-arm64:
    name: Verify Homebrew on macOS arm64
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Tap and verify stable formula metadata
        shell: bash
        run: |
          set -euo pipefail
          brew tap reason-healthcare/rh
          formula_json="$(brew info --json=v2 reason-healthcare/rh/rh)"
          stable_version="$(printf '%s' "$formula_json" | jq -r '.formulae[0].versions.stable')"
          test "$stable_version" = '0.3.0' || { echo "Expected Homebrew stable version 0.3.0, got $stable_version" >&2; exit 1; }

      - name: Fresh install and verify installed CLI
        shell: bash
        run: |
          set -euo pipefail
          brew install reason-healthcare/rh/rh
          installed_version="$(brew list --versions rh)"
          test "$installed_version" = 'rh 0.3.0' || { echo "Unexpected installed Homebrew package: $installed_version" >&2; exit 1; }
          formula_prefix="$(brew --prefix reason-healthcare/rh/rh)"
          binary="$formula_prefix/bin/rh"
          test -x "$binary"
          version="$("$binary" --version)"
          test "$version" = 'rh 0.3.0' || { echo "Unexpected rh --version output: $version" >&2; exit 1; }
          "$binary" --help >/dev/null

  chocolatey-windows-x64:
    name: Verify Chocolatey on Windows x64
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Install published package from the public feed
        shell: pwsh
        run: |
          $logFile = Join-Path $env:RUNNER_TEMP 'rh-choco-install.log'
          choco install rh --version=0.3.0 --yes --no-progress --source https://community.chocolatey.org/api/v2/ --log-file $logFile
          $installExitCode = $LASTEXITCODE
          if ($installExitCode -ne 0) {
            if (Test-Path -LiteralPath $logFile) { Get-Content -LiteralPath $logFile | Write-Host }
            throw "Chocolatey could not install rh 0.3.0 from the public feed (exit code $installExitCode). The version is not currently installable; this alone does not establish why (for example, feed propagation or moderation). Check the package's public feed visibility and publish workflow, then rerun."
          }

      - name: Verify Chocolatey shim and installed CLI
        shell: pwsh
        run: |
          $chocoRoot = $env:ChocolateyInstall
          if ([string]::IsNullOrWhiteSpace($chocoRoot)) { $chocoRoot = Join-Path $env:ProgramData 'chocolatey' }
          $packageTools = Join-Path $chocoRoot 'lib\rh\tools'
          $installedBinary = Join-Path $packageTools 'rh.exe'
          if (-not (Test-Path -LiteralPath $installedBinary -PathType Leaf)) {
            throw "Expected package binary at $installedBinary based on chocolateyinstall.ps1 unzipLocation."
          }

          $command = Get-Command rh.exe -ErrorAction Stop
          $expectedShim = [IO.Path]::GetFullPath((Join-Path $chocoRoot 'bin\rh.exe'))
          $actualCommand = [IO.Path]::GetFullPath($command.Source)
          if (-not $actualCommand.Equals($expectedShim, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Expected Chocolatey shim at $expectedShim, resolved rh.exe to $actualCommand."
          }

          $versionOutput = (& $expectedShim --version | Out-String).Trim()
          $versionExitCode = $LASTEXITCODE
          if ($versionExitCode -ne 0 -or $versionOutput -ne 'rh 0.3.0') {
            throw "Unexpected rh.exe --version result (exit code $versionExitCode): $versionOutput"
          }

          & $expectedShim --help | Out-Null
          $helpExitCode = $LASTEXITCODE
          if ($helpExitCode -ne 0) { throw "rh.exe --help failed with exit code $helpExitCode." }
