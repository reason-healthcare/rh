name: Regenerate FHIR Crates

on:
  push:
    branches: [fix/cql-lower-check-gap]
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-regen-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: actions/cache@v3
        with:
          path: ~/.fhir/packages
          key: fhir-packages-r4-4.0.1-r5-5.0.0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just regen-r4
      - run: just regen-r5
      - name: Commit regenerated crates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crates/rh-hl7_fhir_r4_core/src crates/rh-hl7_fhir_r4_core/README.md
          git add crates/rh-hl7_fhir_r5_core/src crates/rh-hl7_fhir_r5_core/README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate FHIR R4/R5 crates with CI toolchain"
            git push
          fi
